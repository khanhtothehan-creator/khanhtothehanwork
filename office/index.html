<title>Han's Work Space</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Han Workspace: giao diện sáng, rõ chữ (Be Vietnam Pro), thanh công cụ bên trái, thẻ bo mềm. */
:root {
  --olive: #B1B735; --sun: #F4C816; --sky: #9CCBED; --orange: #F9A24A; --pink: #F8B1B9;
  --ink: #33241F; --paper: #FFFDF8; --bg: #F5F2EA; --surface: #FFFFFF; --text: #33241F; --muted: #6F5D54; --line: #DDD3C3; --line-2: #B8AA97; --strong: #4A332B; --on-block: #33241F;
  --grid: transparent; --margin-line: transparent; --focus: #2F6FA3; --mark: #FBE38A;
  --diagram-bg: #3A1A13; --diagram-text: #FDF9ED; --diagram-line: #FDF9ED;
  --grid-img: none;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-7: 28px; --space-10: 40px; --space-14: 56px;
  --radius-0: 0px; --radius-sm: 12px; --radius-pill: 999px;
  --shadow-hard: 0 2px 10px rgba(60, 40, 30, .07); --shadow-soft: 0 1px 3px rgba(60, 40, 30, .12);
  --gutter: 28px; --gutter-r: 28px;
  --font-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2A1713; --surface: #3A211B; --text: #FDF9ED; --muted: #D9BFB3; --line: #5D3F35; --line-2: #8A6A5D; --strong: #E8D3C7; --focus: #F4C816; --paper: #3A211B;
    --mark: #6E5A12; --diagram-bg: #1C0F0C; --shadow-hard: 0 2px 10px rgba(0, 0, 0, .35); --shadow-soft: 0 1px 3px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2A1713; --surface: #3A211B; --text: #FDF9ED; --muted: #D9BFB3; --line: #5D3F35; --line-2: #8A6A5D; --strong: #E8D3C7; --focus: #F4C816; --paper: #3A211B;
  --mark: #6E5A12; --diagram-bg: #1C0F0C; --shadow-hard: 0 2px 10px rgba(0, 0, 0, .35); --shadow-soft: 0 1px 3px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background-color: var(--bg); background-image: var(--grid-img); background-attachment: fixed; color: var(--text); font-family: var(--font-body); font-size: 15px; line-height: 1.65; padding-bottom: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
img { max-width: 100%; }
a { color: var(--text); font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
a:hover { background: var(--sun); color: var(--on-block); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.mark { background: var(--mark); color: var(--on-block); padding: 0 6px; }

/* ---- Tầng 1: Folder Tab + hàng nút phân hệ ---- */
.t1 { position: relative; z-index: 5; background: var(--diagram-bg); padding-top: 18px; }
.t1in { max-width: 1560px; margin: 0 auto; padding-left: var(--gutter); padding-right: var(--gutter-r); display: flex; align-items: flex-end; gap: 36px; }
.tab { position: relative; flex: none; display: flex; align-items: center; gap: 12px; background-color: var(--bg); background-image: var(--grid-img); background-attachment: fixed; border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; padding: 10px 18px 12px; }
.tab::after { content: ""; position: absolute; right: -22px; bottom: 0; width: 22px; height: 22px; border-bottom-left-radius: 22px; box-shadow: -11px 11px 0 11px var(--bg); }
.brand { font: 800 24px var(--font-display); color: var(--text); white-space: nowrap; line-height: 1.1; }
.tab-tools { display: flex; gap: 6px; }
.mini { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: var(--radius-pill); box-shadow: var(--shadow-soft); font: 700 12px var(--font-body); padding: 1px 12px; }
.mini:hover, .np:hover, .btn:hover, .dc:hover, .fpill:hover, .stat.click:hover { background: var(--sun); color: var(--on-block); }
.pills { display: flex; gap: 10px; flex-wrap: wrap; padding-bottom: 12px; min-width: 0; }
.np { border: 1px solid var(--line); border-radius: var(--radius-pill); box-shadow: var(--shadow-soft); color: var(--on-block); font: 700 14px var(--font-body); padding: 4px 16px; white-space: nowrap; }
.np[aria-current="page"] { box-shadow: none; }
.np[aria-current="page"]::before { content: "● "; }
.np.c-sun { background: var(--sun); } .np.c-orange { background: var(--orange); } .np.c-olive { background: var(--olive); } .np.c-pink { background: var(--pink); } .np.c-sky { background: var(--sky); } .np.c-paper { background: var(--paper); }
.mini, .np, .btn, .dc, .fpill, .stat { transition: transform .12s ease, background-color .12s ease; }
.badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; margin-left: 6px; border: 1px solid var(--line); border-radius: var(--radius-pill); background: var(--sun); color: var(--on-block); font: 800 12px var(--font-display); font-style: normal; vertical-align: 1px; }

/* ---- Trang ---- */
.page { position: relative; z-index: 2; max-width: 1560px; margin: 0 auto; padding: 28px var(--gutter-r) 0 var(--gutter); display: flex; flex-direction: column; gap: 28px; }
.t2 { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 20px; align-items: stretch; }
.card, .wcard, .sheet, .stat, .hello, .rc { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-hard); border-radius: var(--radius-sm); min-width: 0; }
.hello { display: flex; align-items: center; gap: 16px; padding: 14px 18px; }
.hello h1 { font: 800 28px var(--font-display); line-height: 1.15; }
.hello p { margin: 4px 0 0; font-size: 17px; }
.t2r { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.stat { display: flex; flex-direction: column; align-items: flex-start; gap: 0; text-align: left; padding: 8px 12px 6px; }
.stat .lb { font: 700 12px var(--font-body); color: var(--muted); }
.stat .num { font: 800 40px var(--font-display); line-height: 1.15; color: var(--text); }
.stat.click:hover .lb, .stat.click:hover .num { color: var(--on-block); }
.fsw { display: flex; flex-wrap: wrap; gap: 8px; }
.fpill { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: var(--radius-pill); box-shadow: var(--shadow-soft); font: 700 13px var(--font-body); padding: 2px 14px; }
.fpill[aria-pressed="true"] { background: var(--olive); color: var(--on-block); box-shadow: none; }
.fpill.add { border-style: dashed; }
.t3 { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.crumbrow { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; }
.crumb-t { font: 700 12.5px var(--font-body); color: var(--muted); overflow-wrap: anywhere; }
.search { position: relative; width: min(100%, 340px); }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-pill); padding: 3px 16px; }
.qres { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-hard); border-radius: var(--radius-sm); padding: 6px; display: flex; flex-direction: column; gap: 2px; max-height: 320px; overflow: auto; }
.qres button { text-align: left; border: 0; background: transparent; padding: 4px 8px; overflow-wrap: anywhere; }
.qres button:hover { background: var(--sun); color: var(--on-block); }
.qres small { font-weight: 700; color: var(--muted); }
.qres .empty { padding: 6px 8px; }
#main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

/* ---- Tổng quan: sơ đồ nhánh + thẻ agent + to-do ---- */
.dgrid { display: grid; grid-template-columns: minmax(0, 1fr) 372px; gap: 20px; align-items: start; }
.dleft { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.sec-t { font: 700 28px var(--font-body); }
.wcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
.wcard { display: flex; flex-direction: column; overflow: visible; }
.wcard:hover { }
.wh { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--on-block); }
.wh h2 { font: 700 17px var(--font-body); }
.wh.c-sun { background: var(--sun); } .wh.c-orange { background: var(--orange); } .wh.c-olive { background: var(--olive); } .wh.c-pink { background: var(--pink); } .wh.c-sky { background: var(--sky); } .wh.c-paper { background: var(--paper); }
.stk { position: relative; background: var(--paper); color: var(--on-block); border: 1px solid var(--line); border-radius: var(--radius-sm); font: 700 12px var(--font-body); padding: 0 8px; white-space: nowrap; }
.wcard:nth-child(even) .stk { } .wcard:nth-child(3n) .stk { }
.stk::after { content: ""; position: absolute; top: -9px; right: -8px; width: 14px; height: 14px; background: var(--olive); }
.wcard:nth-child(2n) .stk::after { background: var(--sun); left: -8px; right: auto; } .wcard:nth-child(3n) .stk::after { background: var(--sky); }
.wb { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px 14px; flex: 1; min-width: 0; }
.cdesc { margin: 0; font-size: 12.5px; color: var(--muted); }
.citems { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.citems .none { color: var(--muted); font-size: 13px; padding: 4px 0; }
.frow .ftx { width: 100%; display: flex; align-items: baseline; gap: 6px; text-align: left; border: 1px solid var(--line); background: var(--bg); padding: 2px 8px; min-width: 0; font-weight: 700; font-size: 13px; border-radius: var(--radius-sm); }
.frow .ftx:hover { background: var(--sun); color: var(--on-block); }
.frow .ftx span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frow .ftx small { margin-left: auto; color: var(--muted); white-space: nowrap; }
.cfoot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
.cfoot small { color: var(--muted); }
.newc { align-items: center; justify-content: center; gap: 6px; padding: 24px 16px; border-style: dashed; text-align: center; color: var(--muted); background: transparent; box-shadow: none; min-height: 180px; }
.newc b { font: 700 16px var(--font-body); color: var(--text); }
.plus { width: 48px; height: 48px; background: var(--olive); color: var(--on-block); border: 1px solid var(--line); border-radius: 50%; font: 800 28px var(--font-display); display: grid; place-items: center; line-height: 1; }

.flowd { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.flowd .scroll { overflow-x: auto; padding-bottom: 8px; }
.fgrid { display: grid; grid-template-columns: repeat(7, minmax(132px, 1fr)); min-width: 940px; position: relative; padding-top: 4px; }
.fgrid::before { content: ""; position: absolute; left: 4%; right: 4%; top: 22px; height: 0; border-top: 1px solid var(--line); }
.fcol { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; padding: 0 6px; }
.fnode { position: relative; z-index: 1; align-self: center; display: flex; flex-direction: column; align-items: center; gap: 0; border: 0; background: transparent; color: var(--text); padding: 0; }
.fnode i { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 50%; background: var(--olive); color: var(--on-block); font: 800 15px var(--font-display); font-style: normal; display: grid; place-items: center; box-shadow: var(--shadow-soft); transition: transform .12s ease, background-color .12s ease; }
.fnode:hover i { background: var(--sun); }
.fnode.today i { background: var(--sun); }
.fnode small { font: 700 12px var(--font-body); margin-top: 4px; }
.branch { margin: 6px 0 0 calc(50% - 1px); border-left: 1px solid var(--line); padding: 4px 0 0 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; align-self: stretch; }
.leaf { position: relative; margin-left: 20px; border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 0 12px; font-size: 12.5px; line-height: 1.45; min-width: 0; color: var(--on-block); display: block; width: calc(100% - 20px); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--pink); box-shadow: var(--shadow-soft); }
.leaf::before { content: ""; position: absolute; left: -22px; top: 50%; width: 20px; height: 0; border-top: 1px solid var(--line); }
button.leaf:hover { background: var(--sun); }
.leaf.ev { background: var(--sky); } .leaf.dl { background: var(--orange); } .leaf.done { background: var(--paper); text-decoration: line-through; opacity: .7; } .leaf.rev { background: var(--sun); }
.leaf.none { background: transparent; border-style: dashed; color: var(--muted); box-shadow: none; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border: 1px solid var(--line); border-radius: 50%; vertical-align: -2px; margin-right: 4px; }

.rc { position: sticky; top: 16px; max-height: calc(100vh - 150px); overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.rtop { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-pill); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 0 12px; font: 700 12.5px var(--font-body); color: var(--text); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--sun); color: var(--on-block); }
.rnav { display: inline-flex; gap: 4px; }
.rnav button { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-pill); padding: 0 10px; font: 700 12.5px var(--font-body); }
.rnav button:hover { background: var(--sun); color: var(--on-block); }
.rlabel { font: 700 15px var(--font-body); text-align: center; }
.gwrap { display: grid; place-items: center; }
.gauge { width: 100%; max-width: 250px; }
.g-track { stroke: var(--line); stroke-opacity: .18; }
.g-arc { transition: stroke-dashoffset .8s cubic-bezier(.2, .8, .2, 1); }
.g-pct { font: 800 30px var(--font-display); fill: var(--text); }
.g-sub { font: 700 12px var(--font-body); fill: var(--muted); }
.gnote { margin: -4px 0 0; text-align: center; font-size: 12.5px; font-weight: 700; }
.evs h3, .tlist h3 { margin: 4px 0; font: 700 13px var(--font-body); color: var(--muted); }
.tlist h3.late { color: var(--text); background: var(--orange); color: var(--on-block); display: inline-block; padding: 0 8px; border: 1px solid var(--line); border-radius: var(--radius-sm); }
.ev { display: flex; gap: 8px; align-items: baseline; font-size: 13px; padding: 1px 4px; }
.ev b { font-variant-numeric: tabular-nums; }
.gtag { font-size: 12px; font-weight: 700; background: var(--olive); color: var(--on-block); border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 0 6px; }
.link { border: 0; background: transparent; color: var(--text); font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; padding: 0; }
.link:hover { background: var(--sun); color: var(--on-block); }
.ttabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ttabs button { display: flex; flex-direction: column; align-items: center; gap: 0; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-soft); padding: 4px 2px; font: 700 12px var(--font-body); border-radius: var(--radius-sm); }
.ttabs button i { font-style: normal; font: 800 15px var(--font-display); }
.ttabs button[aria-selected="true"] { background: var(--sun); color: var(--on-block); box-shadow: none; }
.ttabs .ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; }
.tlist ul, .tl2 { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.revrow { width: 100%; display: flex; flex-direction: column; text-align: left; border: 1px solid var(--line); background: var(--bg); padding: 4px 10px; margin-bottom: 4px; border-radius: var(--radius-sm); }
.revrow:hover { background: var(--sun); color: var(--on-block); }
.revrow small { color: var(--muted); }
.newtask { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
.newtask input[type="text"] { grid-column: 1 / -1; }
.newtask input { border: 1px solid var(--line); background: var(--bg); padding: 4px 10px; min-width: 0; border-radius: var(--radius-sm); }

.trow { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 2px 4px; }
.ck { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); padding: 0; display: grid; place-items: center; transition: background-color .25s, transform .2s; }
.ck:hover { background: var(--sun); }
.ck svg { width: 14px; height: 14px; fill: none; stroke: var(--on-block); stroke-width: 2.6; stroke-linecap: square; stroke-linejoin: miter; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .3s ease .05s; }
.ck.on { background: var(--olive); transform: scale(1.08); }
.ck.on svg { stroke-dashoffset: 0; }
.ttx { position: relative; border: 0; background: transparent; text-align: left; padding: 0; transition: color .3s ease; min-width: 0; overflow-wrap: anywhere; font-weight: 700; flex: 1; font-size: 13.5px; }
.ttx::after { content: ""; position: absolute; left: 0; top: 58%; height: 2px; width: 0; background: currentColor; transition: width .4s ease; }
.trow.done .ttx { color: var(--muted); }
.trow.done .ttx::after { width: 100%; }
.due, .tagc { font-size: 12px; font-weight: 700; border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 0 7px; background: var(--bg); white-space: nowrap; }
.due.late { background: var(--orange); color: var(--on-block); }
.tagc { background: var(--pink); color: var(--on-block); }
.meta { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.rm { border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 4px; }
.rm:hover { color: var(--text); background: var(--sun); }
.fresh { animation: slidein .5s ease, flash 1.8s steps(1, end); }
@keyframes slidein { from { transform: translateX(26px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes flash { 0%, 70% { background-color: var(--mark); } 100% { background-color: transparent; } }

/* ---- Trang con: tờ giấy, form, nút ---- */
.sheet { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { font: 700 28px var(--font-body); overflow-wrap: anywhere; }
.sheet h3.sec { margin: 8px 0 0; font: 700 18px var(--font-body); box-shadow: inset 0 -0.5em 0 var(--mark); align-self: flex-start; }
h2.jt { font-size: 24px; }
.sub { margin: 0; color: var(--muted); font-size: 13.5px; }
.skill { margin: 0; align-self: flex-start; font: 700 12px var(--font-body); color: var(--on-block); background: var(--olive); border: 1px solid var(--line); padding: 0 10px; border-radius: var(--radius-sm); }
.crumb { align-self: flex-start; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-soft); font: 700 13px var(--font-body); border-radius: var(--radius-pill); padding: 1px 14px; }
.crumb:hover { background: var(--sun); color: var(--on-block); }
.chead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
details > summary { cursor: pointer; font: 700 13.5px var(--font-body); }
details { display: flex; flex-direction: column; gap: 8px; }
.ctabs, .tr { display: flex; flex-wrap: wrap; gap: 8px; }
.ctabs { border-top: 2px dashed var(--line); border-bottom: 2px dashed var(--line); padding: 10px 0; align-items: center; }
.ctabs button, .tr button, .pills2 button { border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-soft); border-radius: var(--radius-pill); padding: 1px 14px; font: 700 13.5px var(--font-body); }
.ctabs button:hover, .tr button:hover, .pills2 button:hover { background: var(--sun); color: var(--on-block); }
.ctabs button[aria-pressed="true"], .tr button[aria-pressed="true"], .pills2 button[aria-pressed="true"] { background: var(--olive); color: var(--on-block); box-shadow: none; }
.pills2 { display: flex; gap: 8px; flex-wrap: wrap; }
.ctabs .who { font: 700 13px var(--font-body); margin-right: 6px; }
.tabbody { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ov { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.ovc { display: flex; flex-direction: column; align-items: flex-start; text-align: left; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-soft); padding: 6px 12px; border-radius: var(--radius-sm); }
.ovc:hover { background: var(--sun); color: var(--on-block); }
.ovc b { font: 800 26px var(--font-display); line-height: 1.2; }
.ovc span { font-size: 12.5px; }
.folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.folder { text-align: left; display: flex; flex-direction: column; gap: 4px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-soft); padding: 10px 14px; min-width: 0; border-radius: var(--radius-sm); }
.folder:hover { background: var(--sun); color: var(--on-block); }

.btn { border: 1px solid var(--line); background: var(--olive); color: var(--on-block); font: 700 14.5px var(--font-body); border-radius: var(--radius-pill); box-shadow: var(--shadow-soft); padding: 4px 18px; }

.jobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.job { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-soft); padding: 8px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; border-radius: var(--radius-sm); }

.in { min-width: 0; display: flex; flex-direction: column; gap: 8px; }

.ask { margin: 0; padding: 6px 12px; border: 2px dashed var(--line); background: var(--surface); font-size: 13.5px; }
.gate { border: 2px dashed var(--line); background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }

/* ---- Studio ảnh / video ---- */
.studio { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 20px; align-items: start; }

.steps4 { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }

.steps4 li[data-s="run"] i { background: var(--sun); } .steps4 li[data-s="ok"] i { background: var(--olive); } .steps4 li[data-s="err"] i { background: var(--orange); }

.pal { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

/* ---- Tầng 4: timeline + chatbot ---- */

.chat { position: fixed; right: var(--gutter-r); bottom: 98px; z-index: 45; width: min(430px, calc(100vw - 32px)); height: min(560px, calc(100vh - 190px)); display: none; flex-direction: column; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-hard); overflow: hidden; border-radius: var(--radius-sm); }

.chat header button:hover { background: var(--sun); color: var(--on-block); }
.cmsgs { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding: 12px; }

.cm { max-width: 92%; border: 1px solid var(--line); padding: 4px 12px; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 6px; font-size: 14px; border-radius: var(--radius-sm); }
.cm.user { align-self: flex-end; background: var(--olive); color: var(--on-block); box-shadow: var(--shadow-soft); }

/* ---- Cỏ ba lá pixel ---- */
